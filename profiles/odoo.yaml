# DevFlow framework profile — Odoo
# Data-driven mapping: framework detection -> agents + skills + dispatch keywords.
# Consumed by scripts/lib/detect-framework.mjs and the project-init / agent-dispatch
# / context-sync skills. Add a sibling profile (e.g. rails.yaml) to support a new
# framework — no code change required.
framework: odoo
displayName: Odoo
# A project matches this profile if EITHER a detect.files entry is found in the
# project tree (up to depth 3) OR a detect.manifestDeps substring appears in the
# named manifest file.
detect:
  files: ["__manifest__.py", "__openerp__.py"]
  manifestDeps:
    - file: pyproject.toml
      deps: ["odoo", "openerp"]
    - file: requirements.txt
      deps: ["odoo", "openerp"]
# Perfis NAO contribuem agents (ADR-008 v1.1.0): criar agente de projeto e
# competencia exclusiva do dotcontext. A chave `agents:` foi removida.
#
# Skills copiadas para .context/skills/ quando este perfil casa. Os arquivos
# moram em assets/skills/profiles/odoo/<slug>/ — NUNCA em skills/ do plugin,
# que e namespace global registrado sem opt-out.
skills: ["odoo-development", "frontend-specialist-odoo", "odoo-l10n-br"]
# Liga cada skill a um PAPEL de agente de projeto. O context-sync grava a lista
# como frontmatter `skills:` no agente correspondente (aditivo e idempotente).
skillBindings:
  backend-specialist: ["odoo-development", "odoo-l10n-br"]
  frontend-specialist: ["frontend-specialist-odoo"]
# Dispatch routing: keyword -> PAPEL de agente de projeto (nunca agente do plugin).
dispatchKeywords:
  backend-specialist: ["odoo", "orm", "addon", "l10n_br", "nfc-e", "nf-e"]
  frontend-specialist: ["owl", "qweb", "pos"]
# Eixo de versionamento deste perfil. `series` = odoo-12..odoo-18 sao versoes
# ALTERNATIVAS da mesma coisa: exatamente uma vale. Resolver = escolher uma.
# Perfis sem `axis` seguem no eixo composicao (default), onde libs coexistem.
axis: series
# Sondas de versao, avaliadas em ordem. Declarativas: acrescentar um perfil
# irmao (rails.yaml) nao exige mudanca de codigo.
# NOTA: forma em BLOCO obrigatoria — o parseYaml do repo nao suporta flow-map
# inline ({ file: x, pattern: y }), devolveria a entrada como string crua.
versionDetect:
  - file: .gitmodules
    pattern: path = odoo[\s\S]*?branch = (\d+)\.0
  - file: Dockerfile
    pattern: FROM\s+odoo:(\d+)\.0
  - glob: addons/*/__manifest__.py
    pattern: version['"]?\s*:\s*['"](\d+)\.
    aggregate: majority
# Profile-scoped Standards (enforcement) copied into the project's
# .context/engineering/standards/ ONLY when this profile is detected. The ids
# are mirrored in assets/standards/profiles/odoo/MANIFEST.txt and backed by
# std-<id>.md + machine/std-<id>.js there. The list grows as each batch lands;
# integrity is guarded by tests/integration/test-profile-standards-integrity.mjs.
standards:
  - std-odoo-naming-conventions
  - std-odoo-manifest-hygiene
  - std-odoo-orm-discipline
  - std-odoo-computed-fields
  - std-odoo-i18n
  - std-odoo-code-hygiene
  - std-odoo-version-api-hygiene
  - std-odoo-js-modules
  - std-odoo-qweb-escaping
  - std-odoo-test-discipline
  - std-odoo-module-structure
  - std-odoo-orm-performance
  - std-odoo-security
  - std-odoo-owl-patterns
  - std-odoo-qweb-pdf-safety
# Versioned stack docs to index into the docs-mcp-server global store. Seeded
# into the project's .context/engineering/stacks/manifest.yaml by project-init
# (one key per Odoo series). Each entry mirrors a manifest framework entry:
#   - mcpIndexed: true  → docs queried from the docs-mcp-server global store
#                         (modern default; vs legacy artisanalRef or skipDocs).
#   - discoveryHints    → official docs roots used by the scrape/discover-source.
# The actual index (recursive scrape) is a runtime follow-up the user runs via
# `/devflow:scrape-stack-batch` — the plugin ships only the wishlist.
stacks:
  - lib: odoo-12
    version: "12.0"
    mcpIndexed: true
    discoveryHints: ["https://www.odoo.com/documentation/12.0/"]
  - lib: odoo-13
    version: "13.0"
    mcpIndexed: true
    discoveryHints: ["https://www.odoo.com/documentation/13.0/"]
  - lib: odoo-14
    version: "14.0"
    mcpIndexed: true
    discoveryHints: ["https://www.odoo.com/documentation/14.0/developer/"]
  - lib: odoo-15
    version: "15.0"
    mcpIndexed: true
    discoveryHints: ["https://www.odoo.com/documentation/15.0/developer/"]
  - lib: odoo-16
    version: "16.0"
    mcpIndexed: true
    discoveryHints: ["https://www.odoo.com/documentation/16.0/developer/"]
  - lib: odoo-17
    version: "17.0"
    mcpIndexed: true
    discoveryHints: ["https://www.odoo.com/documentation/17.0/developer/"]
  - lib: odoo-18
    version: "18.0"
    mcpIndexed: true
    discoveryHints: ["https://www.odoo.com/documentation/18.0/developer/"]
